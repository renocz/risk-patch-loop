[project]
name = "risk-patch-loop"
version = "0.9.0"
description = "Exposure-aware vulnerability triage and verified, human-approved patching for Docker Compose hosts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
rpl = "rpl.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rpl"]
